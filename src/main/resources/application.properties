# Enable health Endpoint details
management.endpoint.health.show-details=when_authorized


## -----------------------------------------------------
## 1. CONSOLE READABILITY & COLOR SETTINGS
## -----------------------------------------------------

# ? Enable ANSI console output (i.e., COLORS) in Spring Boot
# This is the single most effective way to improve readability.
spring.output.ansi.enabled=ALWAYS

# ? Customize the Log Level Pattern to include highlighting
# The default pattern will use color if 'ansi.enabled=ALWAYS' is set.
# If you want to force specific color/format, uncomment the line below.
# logging.pattern.level=%highlight(%-5level)

# ? Use a consistent, clean pattern for the entire log line
# %d{yyyy-MM-dd HH:mm:ss.SSS} - Timestamp
# %highlight(%-5level)       - Highlighted Log Level (e.g., DEBUG, INFO)
# [%thread]                  - The executing Thread name
# %cyan(%logger{39})        - The Logger name (typically the class name), set to a max of 39 characters and colored CYAN
# %msg%n                     - The message and a new line
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{39}) - %msg%n

## -----------------------------------------------------
## 2. LOG LEVEL MANAGEMENT (Verbosity Control)
## -----------------------------------------------------

# ? GLOBAL ROOT LEVEL (Default for all logging)
# Set to 'INFO' to show INFO, WARN, and ERROR. Use 'DEBUG' for full troubleshooting.
logging.level.root=INFO

# ? FRAMEWORK-SPECIFIC LEVELS (Keep these clean)
# Set Spring/Hibernate/JPA to INFO to reduce excessive framework noise.
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.data.jpa=INFO

# ? YOUR APPLICATION PACKAGES (The most important setting for debugging)
# Set your application's base package to DEBUG to see all internal logs.
# Replace 'com.example.myapp' with your actual root package.
logging.level.com.example.myapp=DEBUG

# ? Specific Controller/Service for intense debugging
# Use TRACE or DEBUG only for the specific class you are working on.
logging.level.com.example.myapp.controller.VerifyOtpController=TRACE